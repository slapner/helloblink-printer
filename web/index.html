<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Printer</title>
<style>
  :root { --bg:#f4f6f7; --card:#fff; --ink:#16212b; --mute:#5b6b78; --line:#d5dde3; --accent:#0e8f9c; --accent-ink:#fff; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181d; --card:#1b242b; --ink:#e8eef2; --mute:#9fb0bd; --line:#2e3b45; --accent:#35b7c4; --accent-ink:#062227; --bad:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:760px) { main { grid-template-columns:minmax(0,420px) 1fr; align-items:start; } }
  h1 { font-size:20px; margin:0; }
  header { max-width:900px; margin:0 auto; padding:16px 16px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #status { color:var(--mute); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .preview { display:grid; place-items:center; gap:8px; }
  #out { width:100%; max-width:384px; aspect-ratio:1; background:#fff; image-rendering:pixelated; border:1px solid var(--line); }
  #out.round { border-radius:50%; }
  #out.draw { touch-action:none; cursor:crosshair; }
  .tools button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
  label { display:block; font-size:14px; color:var(--mute); margin:12px 0 4px; }
  input[type=text], textarea, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  input[type=range] { width:100%; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tabs button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--mute); }
  #drop.over { border-color:var(--accent); }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--mute); }
  #log { font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; max-height:160px; overflow:auto; color:var(--mute); margin:8px 0 0; }
  .err { color:var(--bad); }
  progress { width:100%; }
</style>
</head>
<body>
<header>
  <h1>Sticker Printer</h1>
  <button id="connect" class="primary">Connect printer</button>
  <span id="status">Not connected</span>
</header>
<main>
  <section class="card preview">
    <canvas id="out" width="384" height="384" class="round"></canvas>
    <div class="row">
      <button id="print" class="primary" disabled>Print</button>
      <button id="feed" disabled>Feed paper</button>
      <label style="margin:0"><input type="checkbox" id="round" checked> Round preview</label>
    </div>
    <progress id="prog" value="0" max="1" hidden></progress>
  </section>

  <section class="card">
    <div class="row tabs">
      <button data-tab="image" aria-pressed="true">Photo</button>
      <button data-tab="text" aria-pressed="false">Text</button>
      <button data-tab="draw" aria-pressed="false">Draw</button>
    </div>

    <div id="tab-image">
      <label>Picture</label>
      <div id="drop">Drop a picture here, paste one, or <button id="pick">choose a file</button>
        <input id="file" type="file" accept="image/*" hidden></div>
      <label>Fit</label>
      <select id="fit"><option value="cover">Fill the sticker (crop)</option><option value="contain">Show the whole picture</option></select>
    </div>

    <div id="tab-text" hidden>
      <label>Words</label>
      <textarea id="words" rows="3">HELLO</textarea>
      <label>Size <span id="sizeV"></span></label>
      <input id="size" type="range" min="20" max="200" value="90">
      <label>Font</label>
      <select id="font"><option>Helvetica</option><option>Georgia</option><option>Marker Felt</option><option>Chalkboard SE</option><option>Courier New</option></select>
      <label><input type="checkbox" id="bold" checked> Bold</label>
    </div>

    <div id="tab-draw" hidden>
      <label>Draw on the sticker with a mouse, finger or pen</label>
      <div class="row tools">
        <button id="pen" aria-pressed="true">Pen</button>
        <button id="eraser" aria-pressed="false">Eraser</button>
        <button id="undo" disabled>Undo</button>
        <button id="clear" disabled>Clear</button>
      </div>
      <label>Thickness <span id="penV"></span></label>
      <input id="penSize" type="range" min="3" max="60" value="8">
    </div>

    <label>Style</label>
    <select id="mode"><option value="dither">Photo (dithered greys)</option><option value="threshold">Line art (pure black and white)</option></select>
    <label>Darkness <span id="darkV"></span></label>
    <input id="dark" type="range" min="-100" max="100" value="0">
    <div id="marginRow">
      <label>Margin <span id="marginV"></span></label>
      <input id="margin" type="range" min="0" max="80" value="24">
    </div>
    <label><input type="checkbox" id="invert"> Invert</label>

    <details>
      <summary>Advanced</summary>
      <label>Blank rows fed after each print</label>
      <input id="tail" type="text" value="120">
      <label>Send raw bytes (hex), for testing</label>
      <div class="row"><input id="hex" type="text" placeholder="1d 67 53" style="flex:1"><button id="sendhex" disabled>Send</button></div>
      <pre id="log"></pre>
    </details>
  </section>
</main>

<script>
// HelloBlink sticker printer (advertises as "HB-xxxx").
// Transport: Microchip transparent-UART BLE service. Protocol, read from the official app:
// each image row is its own raster command  1d 76 30 00 30 00 01 00 + 48 bytes (384 dots, 1 = black, MSB left).
const SVC = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
const WR  = '49535343-8841-43f4-a8d4-ecbe34729bb3';
const NT  = '49535343-1e4d-4bd9-ba61-23c647249616';
const W = 384, H = 384, WB = W / 8;
const ROW_HDR = [0x1d, 0x76, 0x30, 0x00, WB, 0x00, 0x01, 0x00];

const $ = (id) => document.getElementById(id);
const out = $('out'), octx = out.getContext('2d', { willReadFrequently: true });
let device = null, wr = null, busy = false, picture = null, tab = 'image', bits = null;

function log(msg, bad) {
  const el = $('log'); const line = document.createElement('div');
  if (bad) line.className = 'err'; line.textContent = msg; el.append(line); el.scrollTop = el.scrollHeight;
}
function setStatus(text, bad) { $('status').textContent = text; $('status').className = bad ? 'err' : ''; }
function setConnected(on) {
  for (const id of ['print', 'feed', 'sendhex']) $(id).disabled = !on || busy;
  $('connect').textContent = on ? 'Disconnect' : 'Connect printer';
}

async function connect() {
  if (!navigator.bluetooth) { setStatus('This browser has no Web Bluetooth. Use Chrome or Edge.', true); return; }
  if (device?.gatt.connected) { device.gatt.disconnect(); return; }
  try {
    setStatus('Choosing printer…');
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'HB-' }], optionalServices: [SVC] });
    device.addEventListener('gattserverdisconnected', () => { wr = null; setConnected(false); setStatus('Disconnected'); });
    setStatus('Connecting…');
    const svc = await (await device.gatt.connect()).getPrimaryService(SVC);
    wr = await svc.getCharacteristic(WR);
    const nt = await svc.getCharacteristic(NT);
    nt.addEventListener('characteristicvaluechanged', (e) => {
      const b = new Uint8Array(e.target.value.buffer);
      const hex = [...b].map((x) => x.toString(16).padStart(2, '0')).join(' ');
      const txt = String.fromCharCode(...[...b].filter((x) => x >= 32 && x < 127));
      log(`← ${hex}${txt.length > 2 ? '  "' + txt + '"' : ''}`);
    });
    await nt.startNotifications();
    setConnected(true); setStatus('Connected to ' + device.name);
  } catch (e) { setStatus(e.name === 'NotFoundError' ? 'No printer chosen' : 'Could not connect: ' + e.message, e.name !== 'NotFoundError'); }
}

async function send(bytes) { await wr.writeValueWithResponse(Uint8Array.from(bytes)); }

async function sendRows(rows) {
  busy = true; setConnected(true);
  const prog = $('prog'); prog.hidden = false; prog.max = rows.length; prog.value = 0;
  try {
    for (let i = 0; i < rows.length; i++) {
      const pkt = new Uint8Array(8 + WB); pkt.set(ROW_HDR); pkt.set(rows[i], 8);
      await wr.writeValueWithResponse(pkt);
      if (i % 8 === 0) prog.value = i;
    }
    setStatus('Done');
  } catch (e) { setStatus('Printing stopped: ' + e.message, true); }
  finally { busy = false; prog.hidden = true; setConnected(!!wr); }
}

function tailRows() { const n = Math.max(0, Math.min(2000, parseInt($('tail').value, 10) || 0)); return Array.from({ length: n }, () => new Uint8Array(WB)); }

async function print() {
  if (!bits) return;
  const rows = [];
  for (let y = 0; y < H; y++) {
    const r = new Uint8Array(WB);
    for (let x = 0; x < W; x++) if (bits[y * W + x]) r[x >> 3] |= 0x80 >> (x & 7);
    rows.push(r);
  }
  setStatus('Printing…');
  await sendRows(rows.concat(tailRows()));
}

// ---- artwork -> 384x384 black/white ----
function render() {
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  const c = src.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  const m = +$('margin').value, box = W - 2 * m;
  $('marginV').textContent = m + ' px'; $('darkV').textContent = $('dark').value; $('sizeV').textContent = $('size').value + ' px';
  if (tab === 'image' && picture) {
    const fit = $('fit').value, s = (fit === 'cover' ? Math.max : Math.min)(box / picture.width, box / picture.height);
    const w = picture.width * s, h = picture.height * s;
    c.save(); c.beginPath(); c.rect(m, m, box, box); c.clip();
    c.drawImage(picture, (W - w) / 2, (H - h) / 2, w, h); c.restore();
  } else if (tab === 'text') {
    const px = +$('size').value, lines = $('words').value.split('\n');
    c.fillStyle = '#000'; c.textAlign = 'center'; c.textBaseline = 'middle';
    let size = px; const font = () => `${$('bold').checked ? 'bold ' : ''}${size}px "${$('font').value}", sans-serif`;
    c.font = font();
    while (size > 10 && Math.max(...lines.map((l) => c.measureText(l).width)) > box) { size -= 2; c.font = font(); }
    const lh = size * 1.1, y0 = H / 2 - (lines.length - 1) * lh / 2;
    lines.forEach((l, i) => c.fillText(l, W / 2, y0 + i * lh));
  } else if (tab === 'draw') {
    c.drawImage(layer, 0, 0);
  }
  const img = c.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
  const dark = +$('dark').value, inv = $('invert').checked;
  for (let i = 0; i < W * H; i++) {
    const a = img[i * 4 + 3] / 255;
    let v = (0.299 * img[i * 4] + 0.587 * img[i * 4 + 1] + 0.114 * img[i * 4 + 2]) * a + 255 * (1 - a);
    if (inv) v = 255 - v;
    g[i] = v - dark;
  }
  bits = new Uint8Array(W * H);
  if ($('mode').value === 'threshold') { for (let i = 0; i < W * H; i++) bits[i] = g[i] < 128 ? 1 : 0; }
  else {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {   // Floyd–Steinberg, as the official app does
      const i = y * W + x, old = Math.max(0, Math.min(255, g[i])), nv = old < 128 ? 0 : 255, e = old - nv;
      bits[i] = nv === 0 ? 1 : 0;
      if (x + 1 < W) g[i + 1] += e * 7 / 16;
      if (y + 1 < H) { if (x > 0) g[i + W - 1] += e * 3 / 16; g[i + W] += e * 5 / 16; if (x + 1 < W) g[i + W + 1] += e / 16; }
    }
  }
  const o = octx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const v = bits[i] ? 0 : 255; o.data[i * 4] = o.data[i * 4 + 1] = o.data[i * 4 + 2] = v; o.data[i * 4 + 3] = 255; }
  octx.putImageData(o, 0, 0);
}

// ---- draw mode: strokes live on their own layer, render() turns it into dots like any other artwork ----
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
let strokes = [], stroke = null, erasing = false, queued = false;

function paintStroke(s, from = 0) {   // from: index of the first point not yet painted
  lctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
  lctx.strokeStyle = lctx.fillStyle = '#000'; lctx.lineWidth = s.size; lctx.lineCap = lctx.lineJoin = 'round';
  if (from === 0) { lctx.beginPath(); lctx.arc(s.pts[0][0], s.pts[0][1], s.size / 2, 0, 2 * Math.PI); lctx.fill(); from = 1; }
  if (from >= s.pts.length) return;
  lctx.beginPath(); lctx.moveTo(...s.pts[from - 1]);
  for (let i = from; i < s.pts.length; i++) lctx.lineTo(...s.pts[i]);
  lctx.stroke();
}
function repaintLayer() { lctx.clearRect(0, 0, W, H); strokes.forEach((s) => paintStroke(s)); }
function queueRender() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }
function drawButtons() { $('undo').disabled = $('clear').disabled = !strokes.length; }
function point(e) {
  const r = out.getBoundingClientRect();
  return [(e.clientX - r.left - out.clientLeft) * W / out.clientWidth, (e.clientY - r.top - out.clientTop) * H / out.clientHeight];
}
out.onpointerdown = (e) => {
  if (tab !== 'draw' || e.button > 0) return;
  e.preventDefault(); out.setPointerCapture(e.pointerId);
  stroke = { size: +$('penSize').value, erase: erasing, pts: [point(e)], id: e.pointerId };
  strokes.push(stroke); paintStroke(stroke); drawButtons(); queueRender();
};
out.onpointermove = (e) => {
  if (!stroke || e.pointerId !== stroke.id) return;
  const n = stroke.pts.length;
  for (const ev of e.getCoalescedEvents?.() ?? [e]) stroke.pts.push(point(ev));
  if (stroke.pts.length === n) stroke.pts.push(point(e));
  paintStroke(stroke, n); queueRender();
};
out.onpointerup = out.onpointercancel = (e) => { if (stroke && e.pointerId === stroke.id) stroke = null; };
function undo() { if (!strokes.length) return; stroke = null; strokes.pop(); repaintLayer(); drawButtons(); render(); }
function setTool(erase) { erasing = erase; $('pen').setAttribute('aria-pressed', !erase); $('eraser').setAttribute('aria-pressed', erase); }
$('pen').onclick = () => setTool(false);
$('eraser').onclick = () => setTool(true);
$('undo').onclick = undo;
$('clear').onclick = () => { stroke = null; strokes = []; repaintLayer(); drawButtons(); render(); };
$('penSize').oninput = () => { $('penV').textContent = $('penSize').value + ' px'; };
$('penSize').oninput();
addEventListener('keydown', (e) => {
  if (tab !== 'draw' || e.key.toLowerCase() !== 'z' || !(e.metaKey || e.ctrlKey) || e.shiftKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) && document.activeElement.type !== 'range') return;
  e.preventDefault(); undo();
});

function loadPicture(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image(); img.onload = () => { picture = img; render(); }; img.src = URL.createObjectURL(file);
}

$('connect').onclick = connect;
$('print').onclick = print;
$('feed').onclick = async () => { setStatus('Feeding…'); await sendRows(Array.from({ length: 80 }, () => new Uint8Array(WB))); };
$('sendhex').onclick = async () => {
  const h = $('hex').value.replace(/[^0-9a-f]/gi, '');
  if (!h || h.length % 2) { log('Hex must be whole bytes', true); return; }
  const b = h.match(/../g).map((x) => parseInt(x, 16));
  try { await send(b); log('→ ' + h.match(/../g).join(' ')); } catch (e) { log(e.message, true); }
};
$('pick').onclick = () => $('file').click();
$('file').onchange = (e) => loadPicture(e.target.files[0]);
const drop = $('drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); loadPicture(e.dataTransfer.files[0]); };
addEventListener('paste', (e) => { const f = [...e.clipboardData.files][0]; if (f) { setTab('image'); loadPicture(f); } });
function setTab(t) {
  tab = t; $('tab-image').hidden = t !== 'image'; $('tab-text').hidden = t !== 'text'; $('tab-draw').hidden = t !== 'draw';
  $('marginRow').hidden = t === 'draw'; out.classList.toggle('draw', t === 'draw'); stroke = null;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === t));
  if (t !== 'image') $('mode').value = 'threshold';
  render();
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
for (const id of ['fit', 'words', 'size', 'font', 'bold', 'mode', 'dark', 'margin', 'invert']) $(id).oninput = render;
$('round').onchange = (e) => out.classList.toggle('round', e.target.checked);
render();
</script>
</body>
</html>
